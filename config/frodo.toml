# Tunable parameters for the frodo solution. Customer dimensions and limits are
# NOT here: they come from spec/customer_cell.json and must not be changed.
# Use another file with:  FRODO_CONFIG=path/to/file.toml  or  scripts/run.sh -c FILE ...

[logging]
level = "INFO"            # DEBUG, INFO, WARNING, ERROR
file = ""                 # optional log file path; empty = console only

[sim]
timestep_s = 0.002        # physics step
control_dt_s = 0.01       # robot software tick (100 Hz)
seed = 0

[robot]
arm_riser_m = 0.40        # spacer column under the arm (documented robot modification)

# ---- sensors (simulated in frodo.sim, consumed only through frodo.interfaces) ----
# Every message is stamped with its capture time; `latency_s` delays its delivery.
[sensors.lidar]           # two low 2D lidars on opposite base corners -> 360 deg cover
rate_hz = 10.0
latency_s = 0.01
height_m = 0.12
range_max_m = 8.0
range_noise_std_m = 0.005
rays = 540                # per lidar, over fov_deg
fov_deg = 270.0
mounts = [                # x, y in base frame (m), yaw (deg) of the sensor's forward axis
  { name = "front_left", x = 0.26, y = 0.26, yaw_deg = 45.0 },
  { name = "rear_right", x = -0.26, y = -0.26, yaw_deg = -135.0 },
]

[sensors.odometry]
rate_hz = 100.0
latency_s = 0.0
noise_std_frac = 0.01     # per-axis white velocity noise as a fraction of speed
scale_error_std_frac = 0.005  # per-axis constant scale error (wheel radius), drawn from seed

[sensors.imu]
rate_hz = 100.0
latency_s = 0.0
gyro_noise_std_radps = 0.002
gyro_bias_radps = 0.0005
accel_noise_std_mps2 = 0.02

[sensors.joints]          # arm encoders and gripper position, every control tick
position_noise_std_rad = 0.00002

[sensors.conveyor]        # belt encoder per station
rate_hz = 50.0
latency_s = 0.0
speed_noise_std_mps = 0.0002
resolution_m = 0.0001     # encoder count size

[sensors.cameras]
# The customer allows ONE RGB-D camera for the robot. Both mounts exist in the scene so
# they can be compared; only `perception_source` is rendered each sample and fed to the
# perception pipeline. Other enabled cameras render only on request (demos, debugging).
enabled = ["wrist", "mast"]
perception_source = "mast"
width = 640
height = 480
rate_hz = 15.0
latency_s = 0.03
depth_noise_std_m = 0.001 # at 1 m; grows with the square of depth
depth_range_m = [0.10, 5.0]   # outside this the depth pixel is 0 (no return)

[sensors.cameras.mast]    # fixed post on the base, looking down at the work window
pos_m = [0.20, -0.20, 1.50]   # camera centre in the base frame; the post stands under it
yaw_deg = 20.0            # heading of the optical axis in the base frame
pitch_deg = 50.0          # downward tilt from horizontal
fovy_deg = 60.0

# ---- actuators (frodo.sim.actuation: what the drives can physically do) ----
[actuation]
max_linear_mps = 0.5
max_angular_radps = 1.0
max_linear_accel_mps2 = 1.0
max_angular_accel_radps2 = 3.0
velocity_feedforward = true     # lead the position servos so they track velocity without lag
max_following_error_m = 0.05    # servo target never runs further than this from the base
max_following_error_rad = 0.10
grasp_min_gripper_cmd = 0.9     # gripper command (0..1) that counts as "closed" for the weld

# ---- robot software modules ----
[localization]
method = "ekf_icp"        # EKF (odometry + gyro predict) corrected by scan-to-map ICP
# -- scan matcher (point-to-line ICP against the map segments) --
scan_min_range_m = 0.05           # closer returns are the robot's own body
icp_point_stride = 2              # use every n-th beam
icp_max_iterations = 20
icp_max_correspondence_m = 0.30   # first gate: must exceed the worst expected prior error
icp_min_correspondence_m = 0.03   # final gate (~6 sigma of range noise); rejects unmapped objects
icp_gate_sigmas = 3.0             # gate = this many robust std devs of the residuals
icp_tolerance_m = 1e-5            # stop when the correction step is below these
icp_tolerance_rad = 1e-5
icp_min_inliers = 80              # refuse the match with fewer points on the map
icp_min_inlier_fraction = 0.5     # ... or with a smaller share of the valid returns
icp_min_direction_fraction = 0.05 # ... or if the weakest direction has a smaller share of the fit
# -- EKF on [x, y, yaw] --
use_gyro = true                   # yaw rate from the gyro (else wheel odometry)
initial_std_xy_m = 0.02           # uncertainty of the known start pose
initial_std_yaw_rad = 0.02
process_noise_xy_m = 0.002        # random-walk growth per sqrt(second)
process_noise_yaw_rad = 0.002
odometry_error_frac = 0.02        # extra position noise as a fraction of distance travelled
scan_noise_xy_m = 0.005           # floor added to the ICP covariance (map/calibration error)
scan_noise_yaw_rad = 0.003
scan_history_s = 0.20             # estimates kept to line a delayed scan up with its capture time
gate_chi2 = 16.27                 # innovation gate: chi-square, 3 dof, 99.9 %
health_timeout_s = 1.0            # unhealthy without an accepted scan match for this long
health_max_std_xy_m = 0.05
health_max_std_yaw_rad = 0.05

[navigation]
grid_resolution_m = 0.05
inflation_m = 0.45        # robot circumscribed radius (0.40) + margin
planner_snap_m = 0.30     # start/goal inside the inflated zone snaps to a free cell this near
# Hard limits enforced on every base command. The customer limits (0.35 m/s, 0.6 rad/s)
# are applied on top, so raising these above them has no effect.
max_linear_mps = 0.33
max_angular_radps = 0.55
max_linear_accel_mps2 = 0.5
max_angular_accel_radps2 = 1.5
# -- path tracker: reference profile stays inside the hard limits, leaving room for feedback --
cruise_speed_mps = 0.30
cruise_yaw_rate_radps = 0.50
profile_accel_mps2 = 0.40
corner_speed_mps = 0.05           # reference speed through a path corner
tracker_kp_along = 2.0            # 1/s
tracker_kp_cross = 2.0            # 1/s
tracker_kd_cross = 0.0            # derivative gains: 0 for a velocity-controlled base;
tracker_kp_yaw = 2.0              #   raise if the real base shows lag-induced oscillation
tracker_kd_yaw = 0.0
tracker_max_lag_m = 0.15          # reference waits if the base is this far behind
tracker_goal_tolerance_m = 0.05   # path end counts as reached inside this
# -- docking --
dock_switch_distance_m = 0.40   # pre-dock pose: hand over from path tracking to fine docking
dock_tolerance_m = 0.005
dock_tolerance_rad = 0.009      # 0.5 deg (customer limit: 25 mm, 2 deg)
dock_max_linear_mps = 0.08
dock_max_angular_radps = 0.30
dock_decel_mps2 = 0.10          # approach speed <= sqrt(2 * decel * distance)
dock_decel_radps2 = 0.30
dock_kp = 1.5                   # 1/s
dock_kp_yaw = 1.5
dock_ki = 0.0                   # integral off: the velocity-commanded base is an integrator
dock_ki_yaw = 0.0
dock_dwell_s = 0.30             # inside tolerance and at rest for this long = docked

[safety]                  # distances are measured from the edge of the base footprint
enabled = true
footprint_m = 0.57        # side of the square base outline
slow_distance_m = 1.00    # obstacle ahead closer than this: start scaling the speed down
stop_distance_m = 0.45    # ... and no motion toward it at or inside this
corridor_margin_m = 0.10  # the swept corridor is the footprint plus this on each side
rotation_margin_m = 0.05  # turning stops for anything inside the corner circle plus this
scan_timeout_s = 0.5      # lidar data older than this counts as an obstacle
clear_hysteresis_m = 0.05 # after a stop, the obstacle must be this much further away ...
clear_time_s = 0.5        # ... for this long before the base moves again
motion_epsilon_mps = 0.002     # commands below these are "not moving" and are not supervised
motion_epsilon_radps = 0.005
dock_mask_margin_m = 0.05      # while docking, returns within the conveyor outline + this are expected
dock_min_clearance_m = 0.15    # ... but the base still stops if the conveyor is closer than this
human_zone_radius_m = 1.0 # customer rule: person within 1 m of the base footprint (not implemented yet)
max_stop_latency_s = 0.2

[perception]
# "oracle"    = true kit poses from the simulator (ORACLE: for developing the control stack)
# "classical" = colour + depth segmentation, circle fit (not implemented yet)
method = "oracle"
oracle_rate_hz = 30.0     # the oracle reports at a camera-like rate
oracle_noise_std_m = 0.0  # Gaussian position noise added to oracle poses
view_half_length_m = 0.75 # kits farther than this from the conveyor centre are not reported
match_radius_m = 0.10     # detection-to-track association gate (kits are 450 mm apart)
track_timeout_s = 2.0     # drop a track not detected for this long
history_s = 0.5           # belt-travel history kept to line up delayed detections
ring_hsv_low = [95, 120, 60]
ring_hsv_high = [115, 255, 255]

[manipulation]
control_dt_s = 0.01
tilt_deg = 35.0           # gripper pitch away from vertical, about the finger axis
max_speed_mps = 0.25      # tool motion relative to the belt
max_accel_mps2 = 0.8
belt_lead_s = 0.05        # aim ahead on the belt to cancel servo lag
grip_preshape = 120       # Robotiq command 0 (open, 85 mm) .. 255 (closed)
grip_closed = 255
release_radial_m = 0.001  # ring-over-neck error allowed at release
# -- arm controller (frodo.robot.manipulation.arm_controller) --
joint_speed_radps = 1.2   # peak joint speed of stow / unstow moves
hover_height_m = 0.24     # waiting pose: tool height above the kit top (bottles, 0.18 m tall, pass under it)
hover_ahead_m = 0.03      # ... and distance downstream of where the ring's grasp point enters
pregrasp_height_m = 0.04  # approach the grasp point from this far above
grasp_position_tol_m = 0.003   # measured tool-to-grasp-point error allowed before closing
grasp_settle_s = 0.15     # minimum closing time before the grasp check
grasp_still_rate_per_s = 0.2   # fingers count as stopped below this closing rate (fraction/s)
grasp_timeout_s = 2.0
carry_clearance_m = 0.022 # ring centre above the neck top while carrying
place_trim_gain_per_s = 15.0   # integral gain of the ring-over-neck centring
release_dwell_s = 0.10    # centred for this long before release
place_timeout_s = 4.0     # release anyway after this long centring (will likely be rejected)
release_settle_s = 0.30   # wait after opening before retreating
retreat_up_m = 0.08       # retreat: tool this far above the neck top ...
retreat_back_m = 0.05     #   ... and this far back toward the robot
# -- arm safety limits --
# Workspace box for the tool target, in station coordinates (x along the belt, y across it
# toward the robot's side, origin at the conveyor centre). Targets outside are clamped.
workspace_local_x_m = [-0.45, 0.45]
workspace_local_y_m = [-0.10, 0.45]
workspace_below_kit_top_m = 0.008   # lowest tool target: this far below the kit's top surface
workspace_top_z_m = 1.25
max_tool_error_m = 0.03   # measured tool this far from its commanded position ...
tool_error_time_s = 0.30  # ... for this long aborts the cycle (blocked arm)
# -- grasp style --
# "wall"  pinch the ring's downstream wall, one finger inside the hole. That finger cannot
#         pass the bottle neck, so the ring is released above the neck top and falls ~54 mm.
# "outer" pinch across the ring's outer diameter (80 mm; the gripper opens to 85 mm). Both
#         fingers stay outside the bottle, so the ring is lowered onto the shoulder.
grasp = "outer"

[manipulation.grasps.wall]
offset_along_belt_m = 0.032    # tool point relative to the ring centre (mid-wall, downstream)
offset_toward_belt_m = 0.0
offset_up_m = 0.001
preshape = 120                 # Robotiq command while approaching, 0 (open) .. 255
detect_min = 0.55              # measured finger closure (0..1) that means "holding the ring";
detect_max = 0.93              #   an empty gripper closes to ~0.98
release_above_seat_m = 0.0544  # ring centre above its seated height at release (7 mm above the neck top)

[manipulation.grasps.outer]
offset_along_belt_m = 0.0
offset_toward_belt_m = 0.0025  # puts the strip of the tilted, open pad that is level with the ring on its diameter (found by test)
offset_up_m = -0.010           # open pads sit ~12 mm above the tool point; brings them 1.5 mm above the tray
preshape = 0
detect_min = 0.02
detect_max = 0.30
release_above_seat_m = 0.002

[mission]
assemblies_per_station = 5
station_order = ["A", "B"]
# When to leave a station for the next one:
#   "after_accepted"  stay docked until the line controller shows the full batch accepted
#   "after_done"      leave once the batch is reported ASSEMBLY_DONE; wait at the next
#                     station's pre-dock pose until the batch is accepted, return on a reject
leave_policy = "after_accepted"
plc_poll_hz = 10.0        # line-controller register polling rate
pick_window_local_x_m = [-0.33, 0.0]   # a cycle may start while the bottle is inside this
done_margin_m = 0.005     # ASSEMBLY_DONE is only reported this far before the work exit
time_limit_s = 300.0      # the mission runner gives up after this long
sample_period_s = 0.05    # evidence motion samples (customer minimum is 10 Hz)

# ---- customer line (frodo.plant); uses simulator ground truth, never robot decisions ----
[plant]
plc_host = "127.0.0.1"
plc_port = 1502                   # INTERFACES.md default; 0 = pick a free port (tests)
pool_size = 4                     # kit bodies per station, recycled; minimum is checked
magazine_gap_m = 0.30             # clear space between the belt's upstream end and the parked pool
magazine_spacing_m = 0.02         # gap between parked kits
carrier_position_gain_per_s = 20.0  # keeps each carrier on the belt's position, not just its speed
first_kit_id = 1
release_lead_m = 0.15             # bottle travel from release to the work-entry line (not a customer value)
release_phase_range_s = [0.0, 1.0]  # ACCEPTANCE.md: first release this long after readiness
ring_tray_contact_segments = 12   # of the ring's 48 collision segments, how many touch a tray
seat_raw_log = true               # per-step seat samples (seat_samples.jsonl) for hold recompute
demo_duration_s = 60.0            # plant-only demo length (line_demo)
