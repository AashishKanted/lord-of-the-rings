<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title description">
  <title id="title">Kit and rigid-ring reference geometry</title>
  <desc id="description">A dimensioned kit top view and a bottle side view showing the seated ring. Positions and heights follow customer_cell.json.</desc>
  <style>
    text{font-family:Arial,sans-serif;fill:#172b4d;font-size:14px}
    .title{font-size:19px;font-weight:700}.heading{font-size:16px;font-weight:700}
    .small{font-size:13px}.dim{stroke:#8090a0;stroke-width:1.5;fill:none}
  </style>
  <rect width="1000" height="540" fill="white"/>
  <text id="title-text" x="40" y="39" class="title">Advaitic | Kit and rigid-ring reference</text>
  <text x="40" y="61" class="small">Original schematic · measurements are authoritative in customer_cell.json · no robot motion is shown</text>
  <rect x="40" y="85" width="440" height="410" rx="6" fill="#f5f8fb" stroke="#cbd5e1"/>
  <rect x="500" y="85" width="460" height="410" rx="6" fill="#f5f8fb" stroke="#cbd5e1"/>

  <text x="60" y="116" class="heading">Kit top view · 1 px / mm</text>
  <rect x="100" y="165" width="300" height="240" rx="8" fill="#e9eef4" stroke="#6b7d90" stroke-width="2"/>
  <line x1="100" y1="149" x2="400" y2="149" class="dim"/>
  <line x1="100" y1="142" x2="100" y2="156" class="dim"/>
  <line x1="400" y1="142" x2="400" y2="156" class="dim"/>
  <text x="250" y="143" text-anchor="middle" class="small">300 mm</text>
  <line x1="84" y1="165" x2="84" y2="405" class="dim"/>
  <line x1="77" y1="165" x2="91" y2="165" class="dim"/>
  <line x1="77" y1="405" x2="91" y2="405" class="dim"/>
  <text transform="translate(72 285) rotate(-90)" text-anchor="middle" class="small">240 mm</text>
  <circle cx="180" cy="240" r="30" fill="#f4c87c" stroke="#a96426" stroke-width="2"/>
  <circle cx="180" cy="240" r="16" fill="#ffe3b3" stroke="#a96426"/>
  <circle cx="320" cy="240" r="40" fill="#74c0fc" stroke="#1971c2" stroke-width="2"/>
  <circle cx="320" cy="240" r="24" fill="#e9eef4" stroke="#1971c2"/>
  <text x="180" y="322" text-anchor="middle">Bottle Ø60</text>
  <text x="320" y="322" text-anchor="middle">Ring OD80 / ID48</text>
  <text x="250" y="365" text-anchor="middle" class="small">Centre separation: 140 mm</text>
  <line x1="160" y1="442" x2="342" y2="442" stroke="#1971c2" stroke-width="2"/>
  <polygon points="342,442 333,437 333,447" fill="#1971c2"/>
  <text x="250" y="435" text-anchor="middle" class="small">Local +x / belt travel</text>
  <text x="60" y="478" class="small">Bottle (−70, +45) mm · Ring (+70, +45) mm in kit frame</text>

  <text x="520" y="116" class="heading">Seated ring side view · 1.2 px / mm</text>
  <rect x="560" y="420" width="180" height="20" fill="#e9eef4" stroke="#6b7d90"/>
  <rect x="614" y="276" width="72" height="144" fill="#f4c87c" stroke="#a96426" stroke-width="2"/>
  <path d="M614 276L631 252H669L686 276Z" fill="#f4c87c" stroke="#a96426" stroke-width="2"/>
  <rect x="631" y="204" width="38" height="48" fill="#f4c87c" stroke="#a96426" stroke-width="2"/>
  <rect x="602" y="256" width="19" height="10" fill="#74c0fc" stroke="#1971c2" stroke-width="2"/>
  <rect x="679" y="256" width="19" height="10" fill="#74c0fc" stroke="#1971c2" stroke-width="2"/>
  <line x1="722" y1="204" x2="722" y2="420" class="dim"/>
  <line x1="715" y1="204" x2="729" y2="204" class="dim"/>
  <line x1="715" y1="420" x2="729" y2="420" class="dim"/>
  <text x="760" y="222">Bottle height: 180 mm</text>
  <line x1="698" y1="261" x2="743" y2="261" stroke="#1971c2" stroke-width="2"/>
  <polygon points="743,261 734,256 734,266" fill="#1971c2"/>
  <text x="760" y="265">Ring centre shown: 133 mm</text>
  <text x="760" y="287">Target centre: 130–136 mm</text>
  <text x="760" y="320">Ring OD80 / ID48 mm</text>
  <text x="760" y="342">Ring thickness: 8 mm</text>
  <text x="760" y="380">Shoulder: 120–140 mm</text>
  <text x="760" y="402" class="small">Heights from bottle base</text>
  <text x="760" y="433" class="small">Kit top / bottle base</text>
  <text x="520" y="477" class="small">Simulation must verify release, contact and a 0.5 s settled hold.</text>
</svg>
