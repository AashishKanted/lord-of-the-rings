[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "advaitic-systems-assignment"
version = "0.1.0"
description = "Customer packet, line-controller test double and evidence checks for mobile assembly"
requires-python = ">=3.11"
readme = "README.md"
license = "Apache-2.0"
dependencies = []

[project.scripts]
systems-plc = "advaitic_systems.modbus:main"
systems-check = "advaitic_systems.evidence:main"
systems-timing = "advaitic_systems.timing:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.12"]
physics = ["mujoco==3.8.1", "numpy>=1.26,<3"]
# Candidate solution dependencies (not part of the starter).
solution = ["mink>=1.2", "scipy>=1.11", "pillow>=10", "imageio[ffmpeg]>=2.34"]
# Optional: learned segmenter for the perception bake-off (torch, ~2 GB). Not needed to run
# the mission; install with `uv sync --group perception`.
perception = ["ultralytics>=8.4.211"]

[tool.uv]
# Installed by every plain `uv sync` / `uv run`, including the starter's documented
# `uv sync --locked --group dev --group physics`, so a clean checkout runs the solution.
default-groups = ["dev", "physics", "solution"]

[tool.hatch.build.targets.wheel]
packages = ["src/advaitic_systems", "src/frodo"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
